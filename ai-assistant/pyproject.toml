[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-chat-bot-ai-assistant"
version = "2.0.0"
description = "AI-powered assistant for ci-chat-bot (ADK-based)"
readme = {text = "", content-type = "text/plain"}
requires-python = ">=3.12"
authors = [
    {name = "OpenShift CI Team"}
]

dependencies = [
    "google-adk>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.24.0",
    "anthropic[vertex]>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.uv]
python-preference = "only-system"
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
